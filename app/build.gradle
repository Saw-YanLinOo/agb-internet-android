plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 35

    buildFeatures {
        viewBinding = true
    }

    packagingOptions {
        exclude 'META-INF/rxjava.properties'
    }

    defaultConfig {
        applicationId "com.agb.customer.billing"
        minSdk 21
        targetSdk 35
        versionCode 10
        versionName "1.6"

        resConfigs "en", "my"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release

            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    def SEP = "_"
                    def buildType = variant.buildType.name
                    def version = variant.versionName
                    def date = new Date()
                    def formattedDate = date.format('ddMMyy_HHmm')
                    def newApkName = "AGB Internet" + SEP + formattedDate + SEP + buildType + SEP + version + ".apk"
                    outputFileName = new File(newApkName)
                }
            }
        }

        debugManified {
            initWith debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            android.applicationVariants.all { variant ->
                variant.outputs.all {
                    def SEP = "_"
                    def buildType = variant.buildType.name
                    def version = variant.versionName
                    def date = new Date()
                    def formattedDate = date.format('ddMMyy_HHmm')
                    def newApkName = "AGB Internet" + SEP + formattedDate + SEP + buildType + SEP + version + ".apk"
                    outputFileName = new File(newApkName)
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    namespace 'com.agb.customer.billing'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Retrofit Api Call
    implementation "com.squareup.okhttp3:okhttp:4.7.2"
    implementation "com.squareup.okhttp3:logging-interceptor:4.7.2"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    //indicator
//    implementation 'com.tbuonomo.andrui:viewpagerdotsindicator:4.1.2'
    implementation("com.tbuonomo:dotsindicator:5.0")
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
//    implementation 'com.pacioianu.david:ink-page-indicator:1.3.0'
    implementation 'com.github.DavidPacioianu:InkPageIndicator:3293e94f56'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    //gson
    implementation 'com.google.code.gson:gson:2.8.7'

    //facebook shrimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    //loading indicator
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

    //KBZ SDK
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/kbzsdk.jar')
//    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.github.jeasonlzy:okhttp-OkGo:3.0.4'

    //firebase noti
//    implementation 'com.google.firebase:firebase-auth-ktx:21.0.1'
    implementation 'com.google.firebase:firebase-messaging:23.0.0'
    implementation 'com.google.firebase:firebase-core:20.0.2'

//    implementation 'com.gmavenoogle.firebase:firebase-analytics:17.3.0'

    //eventBus
    implementation 'org.greenrobot:eventbus:3.3.1'

    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation "androidx.activity:activity-ktx:1.4.0"
    implementation "androidx.fragment:fragment-ktx:1.4.1"




}